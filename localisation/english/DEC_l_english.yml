 dec.10.d: "A Cossack alliance — Kazakia — has been founded. Ukraine and Zeleny Klin are invited alongside the hosts."
 dec.10.a: "The steppe remembers."
 dec.11.t: "Fire on the Volga"
 dec.11.d: "The Caucasian Union signals Mid-Volga nations. Claims appear over Bulgar, Tatar and Mordvin lands."
 dec.11.a: "The river remembers."
 dec.12.t: "Invitation to the Caucasian Union"
 dec.12.d: "A Caucasian Union has been proclaimed. Our government is invited to join the alliance."
 dec.12.a: "We have been invited."
 dec.13.t: "Invitation to Kazakia"
 dec.13.d: "Kazakia has been proclaimed. Our government is invited to join the Cossack alliance."
 dec.13.a: "We have been invited."
 dec.14.t: "Rebel Coalition Formed"
 dec.14.d: "With more than one nation in open revolt against Moscow, the rebels have formed a common Coalition. Members stay until they join a regional alliance of their own."
 dec.14.a: "Against the centre."
