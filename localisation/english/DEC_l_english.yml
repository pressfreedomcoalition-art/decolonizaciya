 dec.1.t: "A Decolonisation Wave over the Federation"
 dec.1.d: "Movements in the Mid-Volga and the Northwest Caucasus openly speak of ending colonial subjecthood inside the Russian Federation. Maps of Volga Bulgaria and Circassia circulate again."
 dec.1.a: "History is not finished."
 dec.2.t: "Volga Bulgaria Declares Restoration"
 dec.2.d: "From Cheboksary comes a declaration restoring Volga Bulgaria on the land of Chuvashia. The provisional council asks Moscow to recognise a peaceful exit from colonial status."
 dec.2.a: "Recognise and release"
 dec.2.b: "Refuse — crush the claim"
 dec.3.t: "Circassian National Project"
 dec.3.d: "Adyghe, Kabardian and Cherkess activists announce a Circassian confederation project spanning Adygea, Karachay-Cherkessia and Kabardino-Balkaria."
 dec.3.a: "Recognise and release"
 dec.3.b: "Refuse — hold the Caucasus"
 dec.4.t: "Council in Cheboksary"
 dec.4.d: "The Republic of Volga Bulgaria begins writing its own laws. Links to Chuvash and Idel-Ural networks are a priority."
 dec.4.a: "We are no longer a province."
 dec.5.t: "Congress in Maykop"
 dec.5.d: "The Circassian Confederation seats its first congress. Diaspora channels and Caucasian neighbours watch closely."
 dec.5.a: "Circassia rises."
 POLITICS_VBG_COUNCIL_DESC: "Provisional civilian council of the restored Volga Bulgaria."
 POLITICS_CIR_CONGRESS_DESC: "Collective leadership of the Circassian National Congress."