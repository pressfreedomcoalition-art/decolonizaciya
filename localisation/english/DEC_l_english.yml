 # Ukraine Free Nations / League / Coalition
 UKR_DEC_forum_free_peoples: "Forum of Free Peoples"
 UKR_DEC_forum_free_peoples_desc: "Convene a forum of nations seeking freedom from Moscow's empire and coordinate political support for their cause."
 UKR_DEC_forum_free_peoples_tt: "Opens support for the §YLeague of Free Nations§! and the §YCoalition§!."
 UKR_DEC_support_league: "Support the League of Free Nations"
 UKR_DEC_support_league_desc: "Back the League of Free Nations. Separatist sentiment across RF regions rises each month, reaching full strength in about three years."
 UKR_DEC_support_coalition: "Support the Coalition"
 UKR_DEC_support_coalition_desc: "Open Ukraine's path to sponsoring national uprisings inside the RF. No other focuses grant this access."
