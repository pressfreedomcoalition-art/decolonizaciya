 # NATO collapse / RDK
 dec.19.t: "The Federation That Wasn't"
 dec.19.d: "NATO's plan for a tame Russian federation has shattered. National republics refuse subjecthood and declare full independence. Finno-Ugric governments look to Helsinki; Turkic ones to Ankara. In the democratic Russian rump, the Russian Volunteer Corps raises the black-yellow-white spike against the provisional administration."
 dec.19.a: "The map is redrawn."
 dec.20.t: "RDK Rising"
 dec.20.d: "As national republics leave Moscow's orbit, Russian nationalists of the Volunteer Corps denounce the democratic administration as a NATO occupation regime. Columns move on Belgorod and the Black Earth belt. Civil war has begun."
 dec.20.a: "To arms!"
 dec.21.t: "Invitation from Finland's Alliance"
 dec.21.d: "With the Russian federation project collapsing, Finland's alliance extends a hand to Finno-Ugric peoples freed from Moscow."
 dec.21.a: "We stand with our kin."
 dec.22.t: "Invitation from Turkey's Alliance"
 dec.22.d: "Ankara's alliance invites Turkic republics liberated from the failed federation experiment."
 dec.22.a: "Turan remembers."
 dec.23.t: "Russian National State Proclaimed"
 dec.23.d: "The Russian Volunteer Corps has prevailed. The provisional democratic administration is gone. A Russian National State takes its place — and must choose which banner to fly."
 dec.23.a: "A new Russia."
 DEC_RDK_national_state: "Russian National State"
 DEC_RDK_national_state_desc: "Consolidate the Volunteer Corps victory and open the question of national symbols."
