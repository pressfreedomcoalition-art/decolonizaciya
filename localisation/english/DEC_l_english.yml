 DEC_decolonised_solidarity: "Decolonised solidarity"
 dec.1.t: "A Decolonisation Wave over the Federation"
 dec.1.d: "Movements in the Mid-Volga and the Northwest Caucasus openly speak of ending colonial subjecthood inside the Russian Federation. Maps of Volga Bulgaria and Circassia circulate again."
 dec.1.a: "History is not finished."
 dec.2.t: "Volga Bulgaria Declares Restoration"
 dec.2.d: "From Cheboksary comes a declaration restoring Volga Bulgaria on the land of Chuvashia. The provisional council asks Moscow to recognise a peaceful exit from colonial status."
 dec.2.a: "Recognise and release"
 dec.2.b: "Refuse — crush the claim"
 dec.3.t: "Circassian National Project"
 dec.3.d: "Adyghe, Kabardian and Cherkess activists announce a Circassian confederation project spanning Adygea, Karachay-Cherkessia and Kabardino-Balkaria."
 dec.3.a: "Recognise and release"
 dec.3.b: "Refuse — hold the Caucasus"
 dec.4.t: "Council in Cheboksary"
 dec.4.d: "The Republic of Volga Bulgaria begins writing its own laws. Links to Chuvash and Idel-Ural networks are a priority."
 dec.4.a: "We are no longer a province."
 dec.5.t: "Congress in Maykop"
 dec.5.d: "The Circassian Confederation seats its first congress. Diaspora channels and Caucasian neighbours watch closely."
 dec.5.a: "Circassia rises."
 POLITICS_VBG_COUNCIL_DESC: "Provisional civilian council of the restored Volga Bulgaria."
 POLITICS_CIR_CONGRESS_DESC: "Collective leadership of the Circassian National Congress."
 # Start dates
 DEC_BOOKMARK_2013: "October 2013"
 DEC_BOOKMARK_2013_DESC: "Before Euromaidan. Putin is back in the Kremlin, Yanukovych rules Ukraine, Obama is in the White House, Xi takes the helm in Beijing. Lightweight historical setup for the Decolonisation submod."
 DEC_BOOKMARK_2022: "22 February 2022"
 DEC_BOOKMARK_2022_DESC: "Two days before the full-scale invasion. Crimea is Russian, DPR/LPR recognised, Zelenskyy leads Ukraine. Lightweight historical setup for the Decolonisation submod."
 SOV_DEC_2013_DESC: "Third presidential term. Siloviki consolidated, oil rents, post-Medvedev tandem over."
 UKR_DEC_2013_DESC: "Yanukovych presidency. EU association hanging in the balance."
 USA_DEC_2013_DESC: "Second Obama term. Pivot and sequestration politics."
 CHI_DEC_2013_DESC: "Early Xi Jinping era after Hu. Anti-corruption drive begins."
 OTHER_DEC_2013_DESC: "Rest of the world: updated heads of government where covered; OOB and economy still MD 2000 baseline."
 SOV_DEC_2022_DESC: "Putin. Recognised DPR/LPR, Crimea held since 2014. Full invasion not yet launched."
 UKR_DEC_2022_DESC: "Zelenskyy. Donbas war frozen-hot since 2014; Crimea lost."
 USA_DEC_2022_DESC: "Biden administration. NATO cohesion after Afghanistan withdrawal."
 CHI_DEC_2022_DESC: "Xi's third-term trajectory and zero-COVID China."
 OTHER_DEC_2022_DESC: "Rest of the world: updated rulers and key borders; not a full 2022 scenario."
