 DEC_RDK_flag_rdk: "Keep the RDK Spike"
 DEC_RDK_flag_rdk_desc: "Keep the Volunteer Corps colours that won the revolution."
 DEC_RDK_flag_rdk_tt: "Keep the §YRDK§! flag."
 DEC_RDK_flag_tricolor: "Russian Tricolor"
 DEC_RDK_flag_tricolor_desc: "Return to the white-blue-red civil tricolor as a national compromise."
 DEC_RDK_flag_tricolor_tt: "Adopt the §YRussian tricolor§!."
