 # Caucasian Union shared focuses
 DEC_CAU_dagestan_uprising: "Uprising in Dagestan"
 DEC_CAU_dagestan_uprising_desc: "After Chechnya: independent Dagestan with its own army wars on Moscow. Skipped if Dagestan is already free."
 DEC_CAU_ingush_uprising: "Uprising in Ingushetia"
 DEC_CAU_ingush_uprising_desc: "Ingushetia breaks free and joins the Caucasian front against the Federation."
 DEC_CAU_alans_uprising: "Alan–Karachay–Balkar Uprising"
 DEC_CAU_alans_uprising_desc: "Karachay-Cherkessia and Kabardino-Balkaria rise as independent states at war with Russia."
 DEC_CAU_circassia_uprising: "Circassian Uprising"
 DEC_CAU_circassia_uprising_desc: "Proclaim Circassia and open a western Caucasian front."
 DEC_CAU_create_union: "Create the Caucasian Union"
 DEC_CAU_create_union_desc: "Found a Caucasian alliance of the North Caucasus. South Caucasus can be invited later — after peace with Russia."
 DEC_CAU_create_union_tt: "Creates §YCaucasian Union§! and brings in §YNorth Caucasus§! members."
 DEC_CAU_invite_south: "Invite the South Caucasus"
 DEC_CAU_invite_south_desc: "With peace in the north secured, extend formal invitations to Georgia, Armenia, Azerbaijan, Abkhazia and South Ossetia. They may accept or decline."
 DEC_CAU_invite_south_tt: "Sends §Yoptional invitations§! to South Caucasus countries."
 CHE_align_with_turkey: "Brothers in Ankara"
 CHE_align_with_turkey_desc: "Turn away from Moscow and deepen political, trade and influence ties with Turkey."
 CHE_align_with_saudis: "Brothers in Riyadh"
 CHE_align_with_saudis_desc: "Turn away from Moscow and deepen political and financial ties with Saudi Arabia."
 dec.24.t: "Invitation to the Caucasian Union"
 dec.24.d: "The Caucasian Union — already uniting the North — offers our government a place in the alliance. Membership is voluntary."
 dec.24.a: "Accept the invitation"
 dec.24.b: "Decline for now"
 DEC_uprising_independent_tt: "Target becomes §Yindependent§!, receives volunteer brigades and §Ydeclares war on Russia§!."
 CHE_brothers_in_moscow: "Brothers in Moscow"
 CHE_brothers_in_moscow_desc: "Activate the underground Riyadus-Salikhin cell in the capital. The cell rises in Moscow as a Chechen vassal and opens a second front against Russia."
 DEC_uprising_moscow_vassal_tt: "§YRiyadus-Salikhin§! rises in §YMoscow§! as a §Yvassal of Chechnya§!, receives volunteer cells and wars on Russia."
