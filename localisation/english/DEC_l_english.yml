 DEC_RST_state_restoration: "State Restoration"
 DEC_RST_state_restoration_desc: "Independence is only the beginning. We must rebuild the institutions, industry and armed forces of a sovereign state from the ruins of colonial administration."
 DEC_RST_industrial_survey: "Survey Industrial Heritage"
 DEC_RST_industrial_survey_desc: "Catalogue surviving plants, rail corridors and workshops. Much of our industry was run down or stripped — what remains can be restored."
 DEC_RST_restore_railways: "Restore the Rail Network"
 DEC_RST_restore_railways_desc: "Prioritise the repair of trunk lines and junctions so raw materials and finished goods can move again."
 DEC_RST_restart_civilian_plants: "Restart Civilian Plants"
 DEC_RST_restart_civilian_plants_desc: "Bring mothballed civilian factories back online. Local managers know the machines — they need fuel, parts and a clear mandate."
 DEC_RST_restore_defense_plants: "Restore Defense Plants"
 DEC_RST_restore_defense_plants_desc: "Reopen arsenals and repair shops that once supplied the metropole. Their tooling can serve our own army."
 DEC_RST_heavy_industry: "Rebuild Heavy Industry"
 DEC_RST_heavy_industry_desc: "Steel, chemicals and machine-building form the backbone of a modern economy. Restore the large combines first."
 DEC_RST_expand_arms: "Expand Arms Production"
 DEC_RST_expand_arms_desc: "Convert restored workshops into a steady stream of small arms, ammunition and support equipment."
 DEC_RST_strategic_industry: "Strategic Industrial Programme"
 DEC_RST_strategic_industry_desc: "Coordinate civilian and military reconstruction into a single national plan for self-sufficiency."
 DEC_RST_national_university: "National University"
 DEC_RST_national_university_desc: "Found a national university and research centres so we no longer depend on the former metropole for scientific progress."
 DEC_RST_raise_volunteers: "Raise Volunteers"
 DEC_RST_raise_volunteers_desc: "Call on patriots to form volunteer brigades and put five divisions into the field."
 DEC_RST_national_service: "National Service"
 DEC_RST_national_service_desc: "Introduce a national service framework to expand the pool of trained manpower."
 DEC_RST_army_readiness: "Army Readiness Programme"
 DEC_RST_army_readiness_desc: "Standardise training, tighten discipline and raise the organisational readiness of our forces."
