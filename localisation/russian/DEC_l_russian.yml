 DEC_rst_railway_effort_desc: "Национальная программа ремонта магистралей и логистики."
 DEC_rst_national_service: "Национальная служба"
 DEC_rst_national_service_desc: "Обязательная служба расширяет призыв и ускоряет мобилизацию."
 DEC_rst_army_readiness: "Боевая готовность армии"
 DEC_rst_army_readiness_desc: "Улучшенная подготовка и организация войск."
 DEC_rst_war_materiel: "Программа военного снаряжения"
 DEC_rst_war_materiel_desc: "Приоритет заводского выпуска для нужд армии."
 DEC_rst_patriotic_levy: "Патриотический призыв"
 DEC_rst_patriotic_levy_desc: "Военный набор и народная мобилизация."
 DEC_rst_officer_corps: "Национальный офицерский корпус"
 DEC_rst_officer_corps_desc: "Восстановленный командный состав с лучшим планированием."
 DEC_rst_national_university: "Национальный Университет"
 DEC_rst_national_university_desc: "Независимые исследовательские институты ускоряют технологический прогресс."

