 # Caucasian Union shared focuses
 DEC_CAU_dagestan_uprising: "Восстание в Дагестане"
 DEC_CAU_dagestan_uprising_desc: "После Чечни: независимый Дагестан со своей армией воюет с Москвой. Пропускается, если Дагестан уже свободен."
 DEC_CAU_ingush_uprising: "Восстание в Ингушетии"
 DEC_CAU_ingush_uprising_desc: "Ингушетия выходит из-под РФ и открывает кавказский фронт."
 DEC_CAU_alans_uprising: "Восстание Алан — Карачай-Балкара"
 DEC_CAU_alans_uprising_desc: "КЧР и КБР поднимаются как независимые государства в войне с РФ."
 DEC_CAU_circassia_uprising: "Восстание Черкесии"
 DEC_CAU_circassia_uprising_desc: "Провозгласить Черкесию и западный кавказский фронт."
 DEC_CAU_create_union: "Создать Кавказский Союз"
 DEC_CAU_create_union_desc: "Основать кавказский альянс Северного Кавказа. Южный Кавказ можно пригласить позже — после мира с Россией."
 DEC_CAU_create_union_tt: "Создаёт §YКавказский Союз§! и принимает страны §YСеверного Кавказа§!."
 DEC_CAU_invite_south: "Пригласить Южный Кавказ"
 DEC_CAU_invite_south_desc: "После мира на севере направить официальные приглашения Грузии, Армении, Азербайджану, Абхазии и Южной Осетии. Они могут принять или отказаться."
 DEC_CAU_invite_south_tt: "Рассылает §Yдобровольные приглашения§! странам Южного Кавказа."
 CHE_align_with_turkey: "Братья в Анкаре"
 CHE_align_with_turkey_desc: "Отойти от Москвы и укрепить политические, торговые и влиятельные связи с Турцией."
 CHE_align_with_saudis: "Братья в Эр-Рияде"
 CHE_align_with_saudis_desc: "Отойти от Москвы и укрепить политические и финансовые связи с Саудовской Аравией."
 dec.24.t: "Приглашение в Кавказский Союз"
 dec.24.d: "Кавказский Союз — уже объединяющий Север — предлагает нашему правительству место в альянсе. Членство добровольное."
 dec.24.a: "Принять приглашение"
 dec.24.b: "Отклонить пока"
 DEC_uprising_independent_tt: "Цель становится §Yнезависимой§!, получает бригады и §Yобъявляет войну России§!."
 CHE_brothers_in_moscow: "Братья в Москве"
 CHE_brothers_in_moscow_desc: "Активировать подпольную ячейку «Риядус-Салихин» в столице. Ячейка поднимает восстание в Москве как вассал Чечни и открывает второй фронт против России."
 DEC_uprising_moscow_vassal_tt: "§YРиядус-Салихин§! поднимает восстание в §YМоскве§! как §Yвассал Чечни§!, получает ячейки добровольцев и воюет с Россией."
 DEC_CAUCASIAN_UNION_FACTION: "Кавказский Союз"
 DEC_CAU_local_council: "Местный национальный совет"
 DEC_CAU_local_council_desc: "Укрепить местную власть, пока идёт общий кавказский проект."
 # Казачья ветка (параллельно Кавказу)
 DEC_CSK_kuban_uprising: "Кубанское казачье восстание"
 DEC_CSK_kuban_uprising_desc: "Поднять независимое Кубанское Войско против Москвы. Пропускается, если Кубань уже свободна."
 DEC_CSK_don_uprising: "Донское казачье восстание"
 DEC_CSK_don_uprising_desc: "Поднять независимое Донское Войско. Пропускается, если Дон уже свободен."
 DEC_CSK_yaik_uprising: "Верхнеяицкое восстание"
 DEC_CSK_yaik_uprising_desc: "Поднять Верхнеяицкое Войско вокруг Оренбурга. Пропускается, если уже свободно."
 DEC_CSK_create_kazakia: "Основать Казакию"
 DEC_CSK_create_kazakia_desc: "Создать казачий альянс «Казакия» и пригласить Украину и Зелёный Клин."
 DEC_CSK_create_kazakia_tt: "Создаёт §YКазакию§! и приглашает Украину, Зелёный Клин и казачьи войска."
 DEC_CSK_join_intermarium: "Вступить в Междуморье"
 DEC_CSK_join_intermarium_desc: "Если Междуморье или Балтийско-Черноморский союз уже существуют — вступить туда вместо Казакии."
 DEC_CSK_join_intermarium_tt: "Вступить в существующее §YМеждуморье§! / Балтийско-Черноморский союз."
 DEC_CSK_local_host: "Совет Войска"
 DEC_CSK_local_host_desc: "Укрепить власть Войска, пока идёт общий казачий проект."
 DEC_KAZAKIA_FACTION: "Казакия"
 dec.10.t: "Провозглашена Казакия"
 dec.10.d: "Основан казачий альянс — Казакия. Украина и Зелёный Клин приглашены вместе с Войсками."
 dec.10.a: "Степь помнит."
 dec.11.t: "Огонь на Волге"
 dec.11.d: "Кавказский Союз сигналит Средней Волге. Claims на булгарские, татарские и мордовские земли."
 dec.11.a: "Река помнит."
 dec.12.t: "Приглашение в Кавказский Союз"
 dec.12.d: "Провозглашён Кавказский Союз. Наше правительство приглашено в альянс."
 dec.12.a: "Нас пригласили."
 dec.13.t: "Приглашение в Казакию"
 dec.13.d: "Провозглашена Казакия. Наше правительство приглашено в казачий альянс."
 dec.13.a: "Нас пригласили."
 dec.14.t: "Создана Коалиция"
 dec.14.d: "Когда против Москвы восстали больше одной нации, повстанцы образовали общую Коалицию. Страны остаются в ней, пока не вступят в свой региональный альянс."
 dec.14.a: "Против центра."
 DEC_COALITION_FACTION: "Коалиция"
 DEC_CAU_chechnya_uprising: "Восстание в Чечне"
 DEC_CAU_chechnya_uprising_desc: "Поднять независимую Ичкерию против Москвы. Если Чечня уже свободна — шаг пропускается."
 DEC_CAU_bypass_independent_tt: "Уже независимы от РФ — фокус засчитывается и открывает следующий шаг."
# Волга
 DEC_VOL_tatar_uprising: "Татарское восстание"
 DEC_VOL_tatar_uprising_desc: "Поднять независимый Татарстан против Москвы. Для волжских тюрок — сразу; иначе — после финно-угорского пути."
 DEC_VOL_bashkir_uprising: "Башкирское восстание"
 DEC_VOL_bashkir_uprising_desc: "Поднять Башкортостан. Открывает Ногай (общий с Кавказом) и Урал."
 DEC_VOL_chuvash_uprising: "Чувашское восстание"
 DEC_VOL_chuvash_uprising_desc: "Один фокус — вход с тюркской ИЛИ финно-угорской волжской ветки."
 DEC_VOL_chuvash_or_tt: "Общий фокус Чувашии (OR от татар или эрзи)."
 DEC_VOL_erzya_uprising: "Эрзянское восстание"
 DEC_VOL_erzya_uprising_desc: "Поднять Эрзянь Мастор и открыть финно-угорскую цепь. Также открывает волжских тюрок."
 DEC_VOL_finno_opens_turkic_tt: "Финно-угорский путь открывает §Yволжских тюрок§! (путь татар)."
 DEC_VOL_moksha_uprising: "Мокшанское восстание"
 DEC_VOL_moksha_uprising_desc: "Поднять Мокшень Мастор."
 DEC_VOL_mari_uprising: "Восстание Марий Эл"
 DEC_VOL_mari_uprising_desc: "Поднять Марий Эл; далее Удмуртия."
 DEC_VOL_udmurt_uprising: "Удмуртское восстание"
 DEC_VOL_udmurt_uprising_desc: "Завершает блок Волга и открывает Север."
 DEC_VOL_block_complete_tt: "Блок Волга завершён — открываются Север и Урал."
 DEC_VOL_idel_ural: "Основать Идель-Урал"
 DEC_VOL_idel_ural_desc: "Альянс Идель-Урал после завершения Волги."
 DEC_VOL_idel_ural_tt: "Создаёт §YИдель-Урал§!."
 DEC_VOL_bulgar_confederation: "Булгарская Конфедерация"
