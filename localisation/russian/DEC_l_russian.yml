 DEC_COA_machine_uprising: "Создать Восстание Машин"
 DEC_COA_machine_uprising_desc: "Организовать сетевое восстание автоматизации, саботажа и информационной войны против бюрократии РФ."
 DEC_COA_machine_uprising_tt: "Открывает атаки на чиновников регионов, АТС и конференцию по геноциду."
 DEC_EXL_government_in_exile: "Правительство в изгнании"
 DEC_EXL_government_in_exile_desc: "Оформить правительство в изгнании: без своей столицы, но с признанием среди деколонизаторов и Коалиции."
 DEC_EXL_government_in_exile_tt: "Статус правительства в изгнании. Открывает путь к восстанию на родине."
 DEC_EXL_organize_diaspora: "Организовать диаспору"
 DEC_EXL_organize_diaspora_desc: "Собрать кадры, деньги и связи диаспоры для возвращения на историческую родину."
 DEC_EXL_organize_diaspora_tt: "Политическая власть, стабильность и добровольцы диаспоры."
 DEC_EXL_digital_resistance: "Цифровое сопротивление"
 DEC_EXL_digital_resistance_desc: "Сеть саботажа, пропаганды и автоматизации — бывшие «восстание машин» и блокчейн-государство в одной линии."
 DEC_EXL_digital_resistance_tt: "Военная поддержка и подготовка к высадке на родине."
 DEC_EXL_homeland_uprising: "Восстание на родине"
 DEC_EXL_homeland_uprising_desc: "Поднять микровосстание в исторической столице и вернуть войну на родную землю."
 DEC_EXL_homeland_uprising_tt: "Микровосстание дронов в исторической столице; снова открывает региональный фокус восстания."
 DEC_EXL_request_ukr_aid: "Запросить помощь Украины"
 DEC_EXL_request_ukr_aid_desc: "Оружие, добровольцы и, при необходимости, вступление в войну на стороне Украины против РФ."
 DEC_EXL_request_ukr_aid_tt: "Снаряжение и поддержка от Украины; при войне UKR–РФ — присоединение к войне."
 DEC_EXL_request_coalition_aid: "Запросить помощь Коалиции"
 DEC_EXL_request_coalition_aid_desc: "Закрепиться среди восставших наций: солидарность, НАП через АТС, обновление Коалиции."
 DEC_EXL_request_coalition_aid_tt: "Солидарность с восставшими; обновление Коалиции и АТС."
 DEC_EXL_request_western_aid: "Запросить помощь Запада"
 DEC_EXL_request_western_aid_desc: "Дипломатическое и материальное признание правительств в изгнании со стороны НАТО и партнёров."
 DEC_EXL_request_western_aid_tt: "Оружие, казна и мнение стран Запада/НАТО."
 DEC_COA_attack_cau: "Атаковать чиновников Кавказа"
 DEC_COA_attack_cau_desc: "Удары по администрации РФ на Кавказе. Сепаратизм кавказского блока +10%."
 DEC_COA_attack_volga: "Атаковать чиновников Поволжья"
 DEC_COA_attack_volga_desc: "Удары по администрации РФ на Волге. Сепаратизм волжских финно-угров и тюрок +10%."
 DEC_COA_attack_north: "Атаковать чиновников Севера"
 DEC_COA_attack_north_desc: "Удары по администрации РФ на Севере. Сепаратизм Севера +10%."
 DEC_COA_attack_ural: "Атаковать чиновников Урала"
 DEC_COA_attack_ural_desc: "Удары по администрации РФ на Урале. Сепаратизм Урала +10%."
 DEC_COA_attack_siberia: "Атаковать чиновников Сибири"
 DEC_COA_attack_siberia_desc: "Удары по администрации РФ в Сибири. Сепаратизм Сибири +10%."
 DEC_COA_attack_fareast: "Атаковать чиновников Дальнего Востока"
 DEC_COA_attack_fareast_desc: "Удары по администрации РФ на Дальнем Востоке. Сепаратизм Дальнего Востока +10%."
 DEC_COA_attack_sep_tt: "§Y+10%§! сепаратизма в целевом блоке РФ."
 DEC_COA_create_atc: "Создание Ассоциации Третейских Судов"
 DEC_COA_create_atc_desc: "Основать АТС. Все восставшие против РФ получают взаимные НАП. Странам НАТО предлагается меморандум АТС."
 DEC_COA_atc_tt: "НАП между восставшими. НАТО получает ивент меморандума АТС."
 DEC_COA_blockchain_program: "Запуск Блокчейн Государства для блока"
 DEC_COA_blockchain_program_desc: "Открыть запуски блокчейн-государств для наций Коалиции: временные микрорайоны в Западной Украине, пока нация не получит реальную территорию."
 DEC_COA_blockchain_program_tt: "Открывает фокусы запуска блокчейна для каждой нации."
 DEC_COA_genocide_conference: "Конференция по геноциду"
 DEC_COA_genocide_conference_desc: "Интернационализировать дело колонизированных народов. Сепаратизм нацрегионов +5%."
 DEC_COA_genocide_sep_tt: "§Y+5%§! сепаратизма во всех национальных регионах РФ."
 DEC_COA_historical_claims: "Поддержать претензии народов на исторические земли"
 DEC_COA_historical_claims_desc: "Нацстраны получают клеймы на земли, когда-либо у них отнятые. Все регионы РФ кроме исторической Московии покрываются клеймами."
 DEC_COA_historical_claims_tt: "Нацтеги получают клеймы на земли РФ (Московия исключена)."
 DEC_blockchain_launch_tt: "Западный украинский §Yблокчейн-микрорайон§! становится временной столицей этой нации."
 DEC_blockchain_no_enclave_tt: "§RСвободных блокчейн-микрорайонов не осталось.§!"
 DEC_blockchain_already_landed_tt: "У нации уже есть территория — блокчейн-столица не нужна."
 DEC_drone_army_tt: "Создаёт §Yмикровосстание дронов§! (~7 отрядов) в исторической столице нации."
 DEC_uprising_refocus_tt: "Снова открывает фокус восстания этой нации, даже если он был пропущен или выполнен."
 dec.30.t: "Меморандум АТС"
 dec.30.d: "Ассоциация Третейских Судов предлагает принять меморандум: ненападение с нациями, восставшими против РФ, и с другими подписантами."
 dec.30.a: "Принять меморандум."
 dec.30.b: "Отклонить."
 DEC_COA_bc_LAP: "Запуск блокчейн-государства: Лапландии"
 DEC_COA_bc_LAP_desc: "Если у нации ещё нет территории — создать её и передать временный микрорайон Западной Украины. Он вернётся Украине, как только нация получит любой другой регион."
 DEC_COA_drone_LAP: "Создать армию дронов: Лапландии"
 DEC_COA_drone_LAP_desc: "Нужно Восстание Машин. Создаёт микровосстание дронов в исторической столице и снова открывает фокус восстания."
