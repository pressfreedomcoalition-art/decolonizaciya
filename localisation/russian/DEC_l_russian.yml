 DEC_decolonised_solidarity: "Солидарность деколонизированных"
 dec.1.t: "Волна деколонизации над Федерацией"
 dec.1.d: "На Средней Волге и Северо-Западном Кавказе открыто говорят о конце колониального субъектного статуса внутри РФ. Снова ходят карты Волжской Булгарии и Черкесии."
 dec.1.a: "История не закончена."
 dec.2.t: "Волжская Булгария объявляет о восстановлении"
 dec.2.d: "Из Чебоксар приходит декларация о восстановлении Волжской Булгарии на земле Чувашии. Временный совет просит Москву признать мирный выход из колониального статуса."
 dec.2.a: "Признать и отпустить"
 dec.2.b: "Отказать — подавить претензию"
 dec.3.t: "Черкесский национальный проект"
 dec.3.d: "Адыгские, кабардинские и черкесские активисты объявляют проект конфедерации по Адыгее, КЧР и КБР."
 dec.3.a: "Признать и отпустить"
 dec.3.b: "Отказать — удержать Кавказ"
 dec.4.t: "Совет в Чебоксарах"
 dec.4.d: "Республика Волжская Булгария начинает писать собственные законы. Приоритет — связи с чувашскими и идель-уральскими сетями."
 dec.4.a: "Мы больше не губерния."
 dec.5.t: "Конгресс в Майкопе"
 dec.5.d: "Черкесская конфедерация собирает первый конгресс. Диаспора и кавказские соседи внимательно смотрят."
 dec.5.a: "Черкесия поднимается."
 POLITICS_VBG_COUNCIL_DESC: "Временный гражданский совет восстановленной Волжской Булгарии."
 POLITICS_CIR_CONGRESS_DESC: "Коллективное руководство Черкесского национального конгресса."