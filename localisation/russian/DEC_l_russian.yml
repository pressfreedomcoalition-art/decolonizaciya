 # NATO collapse / RDK
 dec.19.t: "Федерация, которой не стало"
 dec.19.d: "План НАТО о послушной российской федерации рухнул. Национальные республики отказываются от статуса субъектов и провозглашают полную независимость. Финно-угорские правительства смотрят на Хельсинки, тюркские — на Анкару. В демократической русской осколочной власти Русский добровольческий корпус поднимает восстание против временной администрации."
 dec.19.a: "Карта перечерчена."
 dec.20.t: "Восстание РДК"
 dec.20.d: "Пока национальные республики уходят из орбиты Москвы, националисты Добровольческого корпуса объявляют демократическую администрацию режимом оккупации НАТО. Колонны идут на Белгород и Черноземье. Гражданская война началась."
 dec.20.a: "К оружию!"
 dec.21.t: "Приглашение в альянс Финляндии"
 dec.21.d: "На фоне развала федеративного проекта альянс Финляндии протягивает руку финно-угорским народам, вышедшим из-под Москвы."
 dec.21.a: "Мы с сородичами."
 dec.22.t: "Приглашение в альянс Турции"
 dec.22.d: "Альянс Анкары приглашает тюркские республики, освобождённые после краха федеративного эксперимента."
 dec.22.a: "Туран помнит."
 dec.23.t: "Провозглашено Русское Национальное Государство"
 dec.23.d: "Русский добровольческий корпус победил. Временная демократическая администрация пала. На её месте — Русское Национальное Государство, которому предстоит выбрать знамя."
 dec.23.a: "Новая Россия."
 DEC_RDK_national_state: "Русское Национальное Государство"
