 DEC_RST_state_restoration: "Восстановление Государства"
 DEC_RST_state_restoration_desc: "Независимость — лишь начало. Нужно заново выстроить институты, промышленность и армию суверенного государства на обломках колониальной администрации."
 DEC_RST_industrial_survey: "Инвентаризация промышленного наследия"
 DEC_RST_industrial_survey_desc: "Учесть уцелевшие заводы, железнодорожные узлы и мастерские. Многое было запущено или вывезено — то, что осталось, можно восстановить."
 DEC_RST_restore_railways: "Восстановление железнодорожной сети"
 DEC_RST_restore_railways_desc: "В приоритете ремонт магистралей и узлов, чтобы вновь пошли сырьё и готовая продукция."
 DEC_RST_restart_civilian_plants: "Запуск гражданских заводов"
 DEC_RST_restart_civilian_plants_desc: "Вернуть в строй законсервированные гражданские предприятия. Местные специалисты знают оборудование — нужны топливо, запчасти и чёткий мандат."
 DEC_RST_restore_defense_plants: "Восстановление оборонных заводов"
 DEC_RST_restore_defense_plants_desc: "Открыть заново арсеналы и ремонтные базы, прежде работавшие на метрополию. Их мощности послужат нашей армии."
 DEC_RST_heavy_industry: "Возрождение тяжёлой промышленности"
 DEC_RST_heavy_industry_desc: "Сталь, химия и машиностроение — основа современной экономики. Сначала крупные комбинаты."
 DEC_RST_expand_arms: "Расширение военного производства"
 DEC_RST_expand_arms_desc: "Превратить восстановленные цеха в стабильный поток стрелкового оружия, боеприпасов и снаряжения."
 DEC_RST_strategic_industry: "Стратегическая промышленная программа"
 DEC_RST_strategic_industry_desc: "Объединить гражданскую и военную реконструкцию в единый план национальной самодостаточности."
 DEC_RST_national_university: "Национальный Университет"
 DEC_RST_national_university_desc: "Основать национальный университет и исследовательские центры, чтобы больше не зависеть от бывшей метрополии в науке и технологиях."
 DEC_RST_raise_volunteers: "Поднять добровольцев"
 DEC_RST_raise_volunteers_desc: "Призвать патриотов в добровольческие бригады и вывести на карту пять дивизий."
 DEC_RST_national_service: "Национальная служба"
 DEC_RST_national_service_desc: "Ввести систему национальной службы, чтобы расширить резерв подготовленного личного состава."
 DEC_RST_army_readiness: "Программа боевой готовности"
 DEC_RST_army_readiness_desc: "Унифицировать подготовку, укрепить дисциплину и поднять организационную готовность войск."
 DEC_RST_war_materiel: "Обеспечение военным снаряжением"
 DEC_RST_war_materiel_desc: "Накопить винтовки, боеприпасы и полевое имущество, чтобы новые части не остались без оружия."
 DEC_RST_call_reserves: "Созвать резерв"
 DEC_RST_call_reserves_desc: "Привести в действие резервные формирования и поставить под ружьё ещё восемь дивизий."
 DEC_RST_patriotic_levy: "Патриотический призыв"
 DEC_RST_patriotic_levy_desc: "Обратиться к каждому способному гражданину. Свободная нация должна уметь себя защитить."
 DEC_RST_officer_corps: "Восстановление офицерского корпуса"
 DEC_RST_officer_corps_desc: "Подготовить и выдвинуть национальный офицерский корпус, свободный от доктрин бывшего сюзерена."
 DEC_RST_total_mobilization: "Полная мобилизация"
 DEC_RST_total_mobilization_desc: "Пока страна в войне, под ружьё идут все оставшиеся резервы. На поле появляются ещё двенадцать дивизий."
 DEC_rst_spawn_volunteers_5_tt: "На карту появляются §Y5 добровольческих бригад§!."
