 # Украина: Форум / Лига / Коалиция
 UKR_DEC_forum_free_peoples: "Форум Свободных Народов"
 UKR_DEC_forum_free_peoples_desc: "Созвать форум народов, стремящихся к свободе от империи Москвы, и координировать политическую поддержку их дела."
 UKR_DEC_forum_free_peoples_tt: "Открывает поддержку §YЛиги Свободных Наций§! и §YКоалиции§!."
 UKR_DEC_support_league: "Поддержать Лигу Свободных Наций"
 UKR_DEC_support_league_desc: "Поддержать Лигу Свободных Наций. Сепаратизм в регионах РФ растёт каждый месяц и за примерно три года доходит до максимума."
 UKR_DEC_support_coalition: "Поддержать Коалицию"
 UKR_DEC_support_coalition_desc: "Открыть Украине путь к поддержке национальных восстаний внутри РФ. Другие фокусы этого доступа не дают."
 UKR_DEC_support_coalition_tt: "Открывает ветки §Yнациональных восстаний§! для Украины."
 UKR_DEC_support_rdk: "Поддержать РДК"
 UKR_DEC_support_rdk_desc: "Финансировать и координировать Русский добровольческий корпус на белгородско-брянско-воронежском направлении."
 UKR_DEC_support_rdk_tt: "Готовит восстание РДК у северной границы."
 UKR_DEC_invade_rf: "Вторжение в РФ"
 UKR_DEC_invade_rf_desc: "Контролировать любую область, граничащую с Белгородской, Брянской или Воронежской, и поднять восстание РДК в одной из них. Нужно 10 000 единиц стрелкового оружия."
 UKR_DEC_invade_rf_tt: "Запускает восстание §YРДК§! в Белгороде, Воронеже или Брянске."
 UKR_DEC_create_lsr: "Создать ЛСР"
 UKR_DEC_create_lsr_desc: "Сформировать Легион Свободной России: приток манпауэра ценой роста коррупции."
 UKR_DEC_create_lsr_tt: "§Y+25 000§! манпауэра. Коррупция растёт."
 UKR_DEC_create_nomad: "Создать НОМАД"
 UKR_DEC_create_nomad_desc: "Поднять формирования НОМАД и усилить тюркский и монгольский сепаратизм в регионах РФ."
 UKR_DEC_create_nomad_tt: "§Y+15 000§! манпауэра. Растёт сепаратизм тюрок и монголов."
 UKR_DEC_create_sibbat: "Создать Сиббат"
 UKR_DEC_create_sibbat_desc: "Сформировать сибирские батальоны: манпауэр, коррупция и рост сепаратизма в Сибири и на Дальнем Востоке."
 UKR_DEC_create_sibbat_tt: "§Y+20 000§! манпауэра. Коррупция растёт. Растёт сепаратизм Сибири и Дальнего Востока."

 DEC_league_separatism_pressure: "Давление Лиги на сепаратизм"
 DEC_league_separatism_pressure_desc: "Международная поддержка свободных народов стабильно повышает сепаратистские настроения в каждом регионе РФ."
 DEC_league_separatism_tt: "Сепаратизм в каждом регионе РФ растёт примерно на §Y2,8%§! в месяц (до §Y100%§! за 3 года)."
 DEC_lsr_formed: "Легион Свободной России"
 DEC_lsr_formed_desc: "Добровольческие формирования Легиона Свободной России."
 DEC_nomad_formed: "НОМАД"
 DEC_nomad_formed_desc: "Формирования НОМАД, ориентированные на тюркские и монгольские регионы."
 DEC_sibbat_formed: "Сиббат"
 DEC_sibbat_formed_desc: "Сибирские добровольческие батальоны."
