 CIR_reunite_circassia: "Воссоединить Черкесию"
 CIR_reunite_circassia_desc: "Заявить исторические черкесские земли Северо-Западного Кавказа."
 CIR_diaspora_return: "Возвращение диаспоры"
 CIR_diaspora_return_desc: "Открыть правовой путь возвращения черкесской диаспоры."
 DEC_decolonised_solidarity: "Солидарность деколонизированных"
 dec.1.t: "Волна деколонизации над Федерацией"
 dec.1.d: "На Средней Волге и Северо-Западном Кавказе открыто говорят о конце колониального субъектного статуса внутри РФ. Снова ходят карты Волжской Булгарии и Черкесии."
 dec.1.a: "История не закончена."
 dec.2.t: "Волжская Булгария объявляет о восстановлении"
 dec.2.d: "Из Чебоксар приходит декларация о восстановлении Волжской Булгарии на земле Чувашии. Временный совет просит Москву признать мирный выход из колониального статуса."
 dec.2.a: "Признать и отпустить"
 dec.2.b: "Отказать — подавить претензию"
 dec.3.t: "Черкесский национальный проект"
 dec.3.d: "Адыгские, кабардинские и черкесские активисты объявляют проект конфедерации по Адыгее, КЧР и КБР."
 dec.3.a: "Признать и отпустить"
 dec.3.b: "Отказать — удержать Кавказ"
 dec.4.t: "Совет в Чебоксарах"
 dec.4.d: "Республика Волжская Булгария начинает писать собственные законы. Приоритет — связи с чувашскими и идель-уральскими сетями."
 dec.4.a: "Мы больше не губерния."
 dec.5.t: "Конгресс в Майкопе"
 dec.5.d: "Черкесская конфедерация собирает первый конгресс. Диаспора и кавказские соседи внимательно смотрят."
 dec.5.a: "Черкесия поднимается."
 POLITICS_VBG_COUNCIL_DESC: "Временный гражданский совет восстановленной Волжской Булгарии."
 POLITICS_CIR_CONGRESS_DESC: "Коллективное руководство Черкесского национального конгресса."
 # Start dates
 DEC_BOOKMARK_2013: "Октябрь 2013"
 DEC_BOOKMARK_2013_DESC: "До Евромайдана. Путин снова в Кремле, Янукович на Украине, Обама в Белом доме, Си у руля КНР. Лёгкая историческая настройка сабмода «Деколонизация»."
 DEC_BOOKMARK_2022: "22 февраля 2022"
 DEC_BOOKMARK_2022_DESC: "За два дня до полномасштабного вторжения. Крым у РФ, ДНР/ЛНР признаны, Зеленский у власти. Лёгкая историческая настройка сабмода «Деколонизация»."
 SOV_DEC_2013_DESC: "Третий срок. Силовики, нефтяная рента, тандем с Медведевым позади."
 UKR_DEC_2013_DESC: "Президентство Януковича. Соглашение об ассоциации с ЕС на весах."
 USA_DEC_2013_DESC: "Второй срок Обамы."
 CHI_DEC_2013_DESC: "Начало эры Си после Ху. Антикоррупционная кампания."
 OTHER_DEC_2013_DESC: "Остальной мир: обновлены правители где покрыто; OOB и экономика — база MD 2000."
 SOV_DEC_2022_DESC: "Путин. Признаны ДНР/ЛНР, Крым с 2014. Полномасштабное вторжение ещё не начато."
 UKR_DEC_2022_DESC: "Зеленский. Донбасс с 2014; Крым потерян."
 USA_DEC_2022_DESC: "Администрация Байдена."
 CHI_DEC_2022_DESC: "Курс Си и zero-COVID Китай."
 OTHER_DEC_2022_DESC: "Остальной мир: правители и ключевые границы; не полный сценарий 2022."
